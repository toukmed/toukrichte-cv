# ═══════════════════════════════════════════════════════
# ToukrichteMed Landing Page
# ═══════════════════════════════════════════════════════
#
# Uses the shared Traefik from creatifpro (creatif-network).
# No second Traefik needed.
#
# LOCAL DEV:    docker compose up -d
#               → http://localhost:4002
#
# PRODUCTION:   docker compose up -d
#               → https://cv.toukrichtemed.com (via creatifpro Traefik)
# ═══════════════════════════════════════════════════════

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toukrichtemed_cv
    restart: unless-stopped
    ports:
      - "4002:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=creatif-network"
      # HTTPS
      - "traefik.http.routers.toukrichtemed-cv-secure.rule=Host(`cv.toukrichtemed.com`)"
      - "traefik.http.routers.toukrichtemed-cv-secure.entrypoints=websecure"
      - "traefik.http.routers.toukrichtemed-cv-secure.tls=true"
      - "traefik.http.routers.toukrichtemed-cv-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.toukrichtemed-cv-secure.service=toukrichtemed-cv"
      - "traefik.http.services.toukrichtemed-cv.loadbalancer.server.port=80"
    networks:
      - creatif-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  creatif-network:
    external: true
